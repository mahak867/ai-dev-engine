<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX SOCIETY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Press+Start+2P&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--bg1:#111;--bg2:#161616;--bg3:#1c1c1c;
  --b1:#222;--b2:#2a2a2a;
  --text:#e0e0e0;--dim:#444;--sub:#777;
  --orange:#ff6b2b;--orange2:#faa32c;--orange3:rgba(255,107,43,0.12);
  --green:#00ff88;--red:#ff4444;--blue:#4499ff;--pink:#ff44cc;--cyan:#00ccff;--yellow:#ffee00;
  --mono:'Share Tech Mono',monospace;--pixel:'Press Start 2P',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:#000}::-webkit-scrollbar-thumb{background:#333}

/* scanlines */
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:9999}

.shell{display:grid;grid-template-rows:auto auto auto 1fr auto;height:100vh;position:relative;z-index:1}

/* header */
.hdr{
  background:#000;border-bottom:2px solid var(--orange);
  padding:6px 16px;display:flex;align-items:center;justify-content:space-between;
}
.hdr-left{display:flex;align-items:center;gap:14px}
.pac-wrap{position:relative;width:28px;height:28px}
.pac-body{
  position:absolute;
  width:28px;height:28px;
  background:var(--yellow);
  border-radius:50%;
  clip-path:polygon(100% 50%,100% 100%,0 100%,0 0,100% 0,100% 50%);
  animation:munch 0.35s steps(1) infinite;
}
@keyframes munch{
  0%{clip-path:polygon(60% 40%,100% 0,100% 100%,0 100%,0 0,100% 0,60% 40%)}
  50%{clip-path:polygon(100% 50%,100% 100%,0 100%,0 0,100% 0)}
}
.pac-eye{position:absolute;width:5px;height:5px;background:#000;border-radius:50%;top:6px;left:12px}
.hdr-title{font-family:var(--pixel);font-size:9px;color:var(--orange);letter-spacing:2px;text-shadow:0 0 12px var(--orange)88}
.hdr-sub{font-size:10px;color:var(--sub);letter-spacing:0.08em}
.hdr-stats{display:flex;gap:20px}
.hstat{display:flex;flex-direction:column;align-items:flex-end}
.hstat-l{font-size:9px;color:var(--dim);letter-spacing:0.08em}
.hstat-v{color:var(--orange2);font-size:11px}

/* nav */
.nav{background:#000;border-bottom:1px solid var(--b2);display:flex;align-items:stretch}
.nav-btn{
  padding:5px 14px;font-size:10px;color:var(--sub);
  cursor:pointer;border-right:1px solid var(--b1);
  letter-spacing:0.05em;transition:all 0.1s;
  display:flex;align-items:center;gap:5px;border-bottom:2px solid transparent;
  background:transparent;border-top:none;border-left:none;font-family:var(--mono);
}
.nav-btn:hover,.nav-btn.on{color:var(--orange);background:var(--orange3);border-bottom-color:var(--orange)}
.nav-key{color:var(--dim);font-size:9px}
.nav-spacer{flex:1}
.ws-pill{display:flex;align-items:center;gap:6px;padding:0 14px;font-size:9px;color:var(--sub)}
.ws-dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex-shrink:0}
.ws-dot.on{background:var(--green);box-shadow:0 0 7px var(--green);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* toolbar */
.tbar{
  background:var(--bg1);border-bottom:1px solid var(--b1);
  padding:7px 14px;display:flex;gap:7px;align-items:center;
}
.tin{
  flex:1;background:#000;border:1px solid var(--b2);
  padding:5px 10px;color:var(--text);font-family:var(--mono);font-size:11px;outline:none;
  transition:border-color 0.15s;
}
.tin:focus{border-color:var(--orange)}
.tin::placeholder{color:var(--dim)}
.tbtn{
  padding:5px 13px;background:#000;border:1px solid var(--b2);
  color:var(--sub);font-family:var(--mono);font-size:10px;cursor:pointer;
  letter-spacing:0.04em;transition:all 0.12s;white-space:nowrap;
}
.tbtn:hover{border-color:var(--orange);color:var(--orange);background:var(--orange3)}
.tbtn.prime{border-color:var(--orange);color:var(--orange)}
.tbtn:disabled{opacity:0.3;cursor:not-allowed}
.clk{font-size:10px;color:var(--dim);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}

/* main area */
.main{display:grid;grid-template-columns:1fr 270px;overflow:hidden}
.graph-wrap{position:relative;overflow:hidden;background:#000}
#gsvg{width:100%;height:100%;position:absolute;inset:0}

/* sidebar */
.side{display:flex;flex-direction:column;border-left:1px solid var(--b2);overflow:hidden}
.panel{display:flex;flex-direction:column;overflow:hidden;border-bottom:1px solid var(--b1)}
.panel:last-child{border-bottom:none;flex:1}
.phd{
  padding:5px 10px;background:var(--bg1);border-bottom:1px solid var(--b1);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
}
.phd-t{font-family:var(--pixel);font-size:7px;color:var(--orange);letter-spacing:1px}
.phd-s{font-size:9px;color:var(--dim)}
.pbody{flex:1;overflow-y:auto;padding:7px 9px}

/* log */
.lr{display:flex;gap:6px;padding:3px 0;border-bottom:1px solid rgba(34,34,34,0.7);font-size:10px;animation:fin 0.18s ease}
@keyframes fin{from{opacity:0}to{opacity:1}}
.lr:last-child{border-bottom:none}
.lts{color:var(--dim);min-width:30px;font-size:9px}
.lag{min-width:62px;font-weight:bold;font-size:9px}
.lmsg{color:var(--sub);flex:1;line-height:1.4;font-size:9px}
.cdone{color:var(--green)}.crun{color:var(--yellow)}.cerr{color:var(--red)}.crej{color:var(--red);font-weight:600}.cdlg{color:#bb88ff}
.aPlanner{color:var(--yellow)}.aArchitect{color:var(--cyan)}.aCoder{color:#bb88ff}
.aReviewer{color:var(--blue)}.aSelfHealer{color:var(--green)}.aDebugger{color:var(--red)}
.aDocWriter{color:var(--sub)}.aSystem{color:var(--orange)}

/* bench/sec */
.bt{width:100%;border-collapse:collapse;font-size:9px}
.bt th{text-align:left;padding:4px 6px;color:var(--sub);border-bottom:1px solid var(--b1);font-weight:normal;letter-spacing:0.05em}
.bt td{padding:4px 6px;border-bottom:1px solid rgba(30,30,30,0.5);color:var(--sub)}
.bt tr:last-child td{border-bottom:none}
.good{color:var(--green)!important}.bad{color:var(--red)!important}.neu{color:var(--sub)!important}
.sc{border-radius:2px;padding:7px 9px;margin-bottom:6px;font-size:9px}
.sc-bad{border:1px solid rgba(255,68,68,0.25);background:rgba(255,68,68,0.04)}
.sc-good{border:1px solid rgba(0,255,136,0.25);background:rgba(0,255,136,0.04)}
.sc-t{font-weight:bold;margin-bottom:3px}
.sc-bad .sc-t{color:var(--red)}.sc-good .sc-t{color:var(--green)}
.sc-code{font-family:var(--mono);font-size:9px;color:var(--dim);background:#000;padding:5px 6px;margin-top:5px;line-height:1.7}
.empty{text-align:center;padding:18px;color:var(--dim);font-size:10px}

/* live agent dialogue feed */
.dlg-feed{display:flex;flex-direction:column;gap:6px;max-height:100%;overflow-y:auto}
.dlg-row{border-radius:2px;padding:6px 8px;font-size:9px;border:1px solid var(--b1);background:#0c0c0c}
.dlg-row.sc-bad{border-color:rgba(255,68,68,0.25);background:rgba(255,68,68,0.04)}
.dlg-row.sc-good{border-color:rgba(0,255,136,0.25);background:rgba(0,255,136,0.04)}
.dlg-meta{display:flex;justify-content:space-between;color:var(--sub);margin-bottom:3px;letter-spacing:0.03em}
.dlg-arrow{color:#bb88ff;font-weight:600}
.dlg-type{text-transform:uppercase;color:var(--dim);font-size:8px}
.dlg-content{color:var(--sub);line-height:1.5}
.dlg-row.sc-bad .dlg-arrow{color:var(--red)}
.dlg-row.sc-good .dlg-arrow{color:var(--green)}

/* statusbar */
.sbar{background:#000;border-top:1px solid var(--orange);padding:3px 12px;display:flex;gap:22px;align-items:center}
.si{display:flex;gap:7px;align-items:center;font-size:10px}
.sl{color:var(--dim)}.sv{color:var(--orange2);font-weight:bold;min-width:28px}
</style>
</head>
<body>
<div class="shell">

<div class="hdr">
  <div class="hdr-left">
    <div class="pac-wrap"><div class="pac-body"></div><div class="pac-eye"></div></div>
    <span class="hdr-title">APEX SOCIETY</span>
    <span class="hdr-sub">QWEN CLOUD · 7-AGENT SYSTEM</span>
  </div>
  <div class="hdr-stats">
    <div class="hstat"><span class="hstat-l">AGENTS</span><span class="hstat-v" id="hsA">0/7</span></div>
    <div class="hstat"><span class="hstat-l">FILES</span><span class="hstat-v" id="hsF">0</span></div>
    <div class="hstat"><span class="hstat-l">QUALITY</span><span class="hstat-v" id="hsQ">—</span></div>
    <div class="hstat"><span class="hstat-l">CVEs</span><span class="hstat-v" id="hsC" style="color:var(--red)">0</span></div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn on" onclick="setTab('agents',this)"><span class="nav-key">[1]</span> AGENTS</button>
  <button class="nav-btn" onclick="setTab('bench',this)"><span class="nav-key">[2]</span> BENCHMARK</button>
  <button class="nav-btn" onclick="setTab('security',this)"><span class="nav-key">[3]</span> SECURITY</button>
  <div class="nav-spacer"></div>
  <div class="ws-pill"><div class="ws-dot" id="wsd"></div><span id="wst">offline</span></div>
</div>

<div class="tbar">
  <input class="tin" id="tin" type="text" value="build a REST API with JWT auth, CRUD operations, and PostgreSQL" placeholder="describe what to build..."/>
  <button class="tbtn prime" id="runBtn" onclick="doRun()">▶ RUN</button>
  <button class="tbtn" onclick="doBench()">⚡ BENCH</button>
  <button class="tbtn" onclick="doReset()">↺ RESET</button>
  <span class="clk" id="clk">00:00</span>
</div>

<div class="main">
  <div class="graph-wrap" id="gw">
    <svg id="gsvg" viewBox="-400 -300 800 600"></svg>
  </div>
  <div class="side">
    <div class="panel" style="flex:1.3">
      <div class="phd"><span class="phd-t">EXEC LOG</span><span class="phd-s" id="lc">0 events</span></div>
      <div class="pbody" id="lp"><div class="empty">waiting...</div></div>
    </div>
    <div class="panel" style="flex:1" id="dynPanel">
      <div class="phd"><span class="phd-t" id="dynT">BENCHMARK</span></div>
      <div class="pbody" id="dynB"><div class="empty">click benchmark</div></div>
    </div>
  </div>
</div>

<div class="sbar">
  <div class="si"><span class="sl">STATUS</span><span class="sv" id="sbS">IDLE</span></div>
  <div class="si"><span class="sl">SESSION</span><span class="sv" id="sbSess">—</span></div>
  <div class="si"><span class="sl">AGENTS</span><span class="sv" id="sbA">0/7</span></div>
  <div class="si"><span class="sl">FILES</span><span class="sv" id="sbF">0</span></div>
  <div style="flex:1"></div>
  <span style="font-size:9px;color:var(--dim)">APEX SOCIETY v1.0 · QWEN CLOUD · press 1-3 to navigate</span>
</div>

</div><!-- .shell -->

<script>
// ── SVG namespace ──────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function s(tag){return document.createElementNS(NS,tag)}

// ── agent config ───────────────────────────────────────────────────────────────
const AG = [
  {id:'Planner',   col:'#ffee00', lbl:'planner',   x:0,    y:-220},
  {id:'Architect', col:'#00ccff', lbl:'architect', x:220,  y:-100},
  {id:'Coder',     col:'#bb88ff', lbl:'coder',     x:220,  y:110},
  {id:'Reviewer',  col:'#4499ff', lbl:'reviewer',  x:0,    y:220},
  {id:'SelfHealer',col:'#00ff88', lbl:'healer',    x:-220, y:110},
  {id:'Debugger',  col:'#ff4444', lbl:'debugger',  x:-220, y:-100},
  {id:'DocWriter', col:'#888888', lbl:'docs',      x:0,    y:0},
];
const EDGES=[
  ['Planner','Architect'],['Planner','DocWriter'],['Planner','Coder'],
  ['Architect','Coder'],['Coder','Reviewer'],
  ['Reviewer','SelfHealer'],['SelfHealer','Debugger'],
  ['Debugger','Coder'],['DocWriter','Reviewer'],
];

// ── force simulation (simple) ─────────────────────────────────────────────────
let nodes = AG.map(a=>({...a, vx:0, vy:0, pinned:false, _wa:Math.random()*Math.PI*2}));
let simRunning = true;

function forceStep(){
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      if(d<160){const f=7000/(d*d);nodes[i].vx+=dx/d*f;nodes[i].vy+=dy/d*f;nodes[j].vx-=dx/d*f;nodes[j].vy-=dy/d*f;}
    }
  }
  EDGES.forEach(([a,b])=>{
    const na=nodes.find(n=>n.id===a),nb=nodes.find(n=>n.id===b);if(!na||!nb)return;
    const dx=nb.x-na.x,dy=nb.y-na.y,d=Math.sqrt(dx*dx+dy*dy)||1,ideal=170,f=(d-ideal)*0.006;
    na.vx+=dx/d*f;na.vy+=dy/d*f;nb.vx-=dx/d*f;nb.vy-=dy/d*f;
  });
  nodes.forEach(n=>{
    if(nstate[n.id]==='running'){n._wa+=(Math.random()-0.5)*0.3;n.vx+=Math.cos(n._wa)*0.3;n.vy+=Math.sin(n._wa)*0.3;}
    n.vx-=n.x*0.007;n.vy-=n.y*0.007;n.vx*=0.82;n.vy*=0.82;
    const spd=Math.sqrt(n.vx*n.vx+n.vy*n.vy);if(spd>3){n.vx=n.vx/spd*3;n.vy=n.vy/spd*3;}
    if(!n.pinned){n.x+=n.vx;n.y+=n.vy;}
    n.x=Math.max(-330,Math.min(330,n.x));n.y=Math.max(-230,Math.min(230,n.y));
  });
  requestAnimationFrame(forceStep);
  drawGraph();
}

// ── state ──────────────────────────────────────────────────────────────────────
let nstate={}, logs=[], t0=null, ticker=null, isRunning=false;
let doneCnt=0, fileCnt=0, cveCnt=0;
let animDots={}; // agent→active SVG dot group
AG.forEach(a=>{nstate[a.id]='idle'});

// ── draw SVG graph ─────────────────────────────────────────────────────────────
function getPos(id){const n=nodes.find(n=>n.id===id);return n?[n.x,n.y]:[0,0]}

function buildEdgePath(ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, dist=Math.sqrt(dx*dx+dy*dy)||1;
  // shorten endpoints
  const sr=28, tr=28;
  const sRatio=sr/dist, eRatio=(dist-tr)/dist;
  const sx=ax+dx*sRatio, sy=ay+dy*sRatio;
  const ex=ax+dx*eRatio, ey=ay+dy*eRatio;
  // perpendicular control point for bezier curve
  const cx=(sx+ex)/2 + (-dy/dist)*0.3*Math.max(35,dist*0.18);
  const cy=(sy+ey)/2 + (dx/dist)*0.3*Math.max(35,dist*0.18);
  return `M ${sx} ${sy} Q ${cx} ${cy} ${ex} ${ey}`;
}

function drawGraph(){
  const svg=document.getElementById('gsvg');

  // get or create layers
  let edgeLayer=svg.querySelector('#edgeLayer');
  let dotLayer=svg.querySelector('#dotLayer');
  let nodeLayer=svg.querySelector('#nodeLayer');
  if(!edgeLayer){
    edgeLayer=s('g');edgeLayer.id='edgeLayer';svg.appendChild(edgeLayer);
    dotLayer=s('g');dotLayer.id='dotLayer';svg.appendChild(dotLayer);
    nodeLayer=s('g');nodeLayer.id='nodeLayer';svg.appendChild(nodeLayer);
  }

  edgeLayer.innerHTML='';
  dotLayer.innerHTML='';
  nodeLayer.innerHTML='';

  // edges
  EDGES.forEach(([a,b])=>{
    const [ax,ay]=getPos(a), [bx,by]=getPos(b);
    const path=buildEdgePath(ax,ay,bx,by);
    const active=nstate[a]==='running'||nstate[b]==='running';
    const bothDone=nstate[a]==='done'&&nstate[b]==='done';
    const acol=AG.find(n=>n.id===a).col;

    // edge line
    const p=s('path');
    p.setAttribute('d',path);p.setAttribute('fill','none');
    p.setAttribute('stroke', active?acol : bothDone?acol+'55' : '#2a2a2a');
    p.setAttribute('stroke-width', active?2:1);
    p.setAttribute('stroke-dasharray', active?'none':'4 8');
    p.setAttribute('stroke-opacity', active?1:0.7);
    edgeLayer.appendChild(p);

    // animated dots on active edges (exactly like Octogent's animateMotion)
    if(active || bothDone){
      [0,1,2].forEach(i=>{
        // trail dot
        const trail=s('circle');
        trail.setAttribute('r', active?4.6:3);
        trail.setAttribute('fill', acol);
        trail.setAttribute('opacity', Math.max(0.1, 0.25-i*0.04));
        const mt=s('animateMotion');
        mt.setAttribute('path',path);
        mt.setAttribute('begin',`${i*0.62}s`);
        mt.setAttribute('dur', active?'1.9s':'3s');
        mt.setAttribute('repeatCount','indefinite');
        mt.setAttribute('rotate','auto');
        const ar=s('animate');
        ar.setAttribute('attributeName','r');
        ar.setAttribute('values',active?'3.8;5.2;3.8':'2;3;2');
        ar.setAttribute('dur',active?'1.9s':'3s');
        ar.setAttribute('begin',`${i*0.62}s`);
        ar.setAttribute('repeatCount','indefinite');
        trail.appendChild(mt); trail.appendChild(ar);
        dotLayer.appendChild(trail);

        // main dot
        const dot=s('circle');
        dot.setAttribute('r', active?3.2:2);
        dot.setAttribute('fill','#fff4cc');
        dot.setAttribute('stroke',acol);
        dot.setAttribute('stroke-width','1.2');
        dot.setAttribute('opacity', Math.max(0.6, 1-i*0.08));
        const mt2=s('animateMotion');
        mt2.setAttribute('path',path);
        mt2.setAttribute('begin',`${i*0.62}s`);
        mt2.setAttribute('dur',active?'1.9s':'3s');
        mt2.setAttribute('repeatCount','indefinite');
        mt2.setAttribute('rotate','auto');
        const ar2=s('animate');
        ar2.setAttribute('attributeName','r');
        ar2.setAttribute('values',active?'2.8;3.8;2.8':'1.8;2.5;1.8');
        ar2.setAttribute('dur',active?'1.9s':'3s');
        ar2.setAttribute('begin',`${i*0.62}s`);
        ar2.setAttribute('repeatCount','indefinite');
        dot.appendChild(mt2); dot.appendChild(ar2);
        dotLayer.appendChild(dot);
      });
    }
  });

  // nodes
  AG.forEach(ag=>{
    const [x,y]=getPos(ag.id);
    const st=nstate[ag.id];
    const col=ag.col;
    const g=s('g');
    g.setAttribute('transform',`translate(${x},${y})`);
    g.style.cursor='grab';

    // glow ring when active
    if(st==='running'){
      const glow=s('circle');
      glow.setAttribute('r','42');
      glow.setAttribute('fill',col+'12');
      glow.setAttribute('stroke',col+'33');
      glow.setAttribute('stroke-width','1');
      g.appendChild(glow);

      // pulsing outer ring animation
      const ring=s('circle');
      ring.setAttribute('r','34');
      ring.setAttribute('fill','none');
      ring.setAttribute('stroke',col);
      ring.setAttribute('stroke-width','1.5');
      ring.setAttribute('stroke-dasharray','4 4');
      ring.setAttribute('opacity','0.7');
      const ra=s('animateTransform');
      ra.setAttribute('attributeName','transform');ra.setAttribute('type','rotate');
      ra.setAttribute('from','0');ra.setAttribute('to','360');
      ra.setAttribute('dur','2s');ra.setAttribute('repeatCount','indefinite');
      ring.appendChild(ra);
      g.appendChild(ring);

      // second ring counter-rotating
      const ring2=s('circle');
      ring2.setAttribute('r','26');
      ring2.setAttribute('fill','none');
      ring2.setAttribute('stroke',col);
      ring2.setAttribute('stroke-width','1');
      ring2.setAttribute('stroke-dasharray','2 6');
      ring2.setAttribute('opacity','0.4');
      const ra2=s('animateTransform');
      ra2.setAttribute('attributeName','transform');ra2.setAttribute('type','rotate');
      ra2.setAttribute('from','360');ra2.setAttribute('to','0');
      ra2.setAttribute('dur','3s');ra2.setAttribute('repeatCount','indefinite');
      ring2.appendChild(ra2);
      g.appendChild(ring2);
    }

    if(st==='done'){
      const glow=s('circle');
      glow.setAttribute('r','32');
      glow.setAttribute('fill',col+'0a');
      glow.setAttribute('stroke',col+'33');
      glow.setAttribute('stroke-width','1');
      g.appendChild(glow);
    }

    if(st==='rejected'){
      const glow=s('circle');
      glow.setAttribute('r','36');
      glow.setAttribute('fill','#ff444415');
      glow.setAttribute('stroke','#ff4444');
      glow.setAttribute('stroke-width','1.5');
      const pa=s('animate');
      pa.setAttribute('attributeName','opacity');
      pa.setAttribute('values','1;0.3;1');
      pa.setAttribute('dur','0.8s');pa.setAttribute('repeatCount','indefinite');
      glow.appendChild(pa);
      g.appendChild(glow);
    }

    // node body
    const R=24;
    const body=s('circle');
    body.setAttribute('r',R);
    body.setAttribute('fill', st==='running'?col+'22': st==='rejected'?'#ff444422': st==='done'?col+'11':'#111');
    body.setAttribute('stroke', st==='running'?col: st==='rejected'?'#ff4444': st==='done'?col+'88': '#2a2a2a');
    body.setAttribute('stroke-width', st==='running'||st==='rejected'?2:1);
    g.appendChild(body);

    // pulse animation on node body when running
    if(st==='running'){
      const pa=s('animate');
      pa.setAttribute('attributeName','r');
      pa.setAttribute('values',`${R};${R+2};${R}`);
      pa.setAttribute('dur','1s');pa.setAttribute('repeatCount','indefinite');
      body.appendChild(pa);
    }

    // pixel octopus character via foreignObject
    const fo=s('foreignObject');
    fo.setAttribute('x','-24');fo.setAttribute('y','-24');
    fo.setAttribute('width','48');fo.setAttribute('height','54');
    fo.style.pointerEvents='none';fo.style.overflow='visible';
    const div=document.createElementNS('http://www.w3.org/1999/xhtml','div');
    div.style.cssText='width:48px;height:54px;display:flex;align-items:center;justify-content:center;overflow:hidden';
    const cvs=document.createElementNS('http://www.w3.org/1999/xhtml','canvas');
    cvs.width=48;cvs.height=54;
    drawOctopus(cvs,col,st,ag.id);
    div.appendChild(cvs);fo.appendChild(div);g.appendChild(fo);

    // label
    const lbl=s('text');
    lbl.setAttribute('text-anchor','middle');
    lbl.setAttribute('y','38');
    lbl.setAttribute('font-size','9');
    lbl.setAttribute('font-family','Share Tech Mono,monospace');
    lbl.setAttribute('fill', st==='running'?col: st==='rejected'?'#ff4444': st==='done'?col+'99':'#444');
    lbl.setAttribute('letter-spacing','1');
    lbl.textContent=ag.lbl.toUpperCase();
    g.appendChild(lbl);

    // [ ACTIVE ] blinking label
    if(st==='running'){
      const act=s('text');
      act.setAttribute('text-anchor','middle');
      act.setAttribute('y','50');
      act.setAttribute('font-size','7');
      act.setAttribute('font-family','Share Tech Mono,monospace');
      act.setAttribute('fill',col);
      act.textContent='[ ACTIVE ]';
      const ab=s('animate');
      ab.setAttribute('attributeName','opacity');
      ab.setAttribute('values','1;0;1');ab.setAttribute('dur','0.8s');
      ab.setAttribute('repeatCount','indefinite');
      act.appendChild(ab);
      g.appendChild(act);
    }

    nodeLayer.appendChild(g);
  });
}

// ── Octogent-style animated octopus ─────────────────────────────────────────
const B='B',O='O',E='E',_='';const PX=3;
const HT=[[_,_,_,_,O,O,O,O,O,O,O,O,_,_,_,_],[_,_,_,O,B,B,B,B,B,B,B,B,O,_,_,_],[_,_,O,B,B,B,B,B,B,B,B,B,B,O,_,_]];
const HB=[[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_],[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_],[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_],[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_]];
const HB2=[[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_],[_,O,B,B,B,O,O,O,O,O,O,O,B,B,O,_],[_,O,B,B,B,O,O,O,O,O,O,O,B,B,O,_],[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_]];
const HTA=[[_,_,_,_,O,O,O,O,O,O,O,O,_,_,_,_],[_,_,_,O,B,B,B,B,B,B,B,B,O,_,_,_],[_,_,O,B,O,B,B,B,B,B,B,O,B,O,_,_]];
const HBA=[[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_],[_,O,B,B,B,B,O,O,O,O,O,B,B,B,O,_],[_,O,B,B,B,B,O,O,O,O,O,B,B,B,O,_],[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_]];
const FN=[[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_],[_,O,B,B,E,E,B,B,B,B,E,E,B,B,O,_],[_,O,B,B,E,E,B,B,B,B,E,E,B,B,O,_]];
const FH=[[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_],[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_],[_,O,B,B,E,E,B,B,B,B,E,E,B,B,O,_]];
const FA=[[_,O,B,B,B,B,B,B,B,B,B,B,B,B,O,_],[_,O,B,O,E,E,B,B,B,B,E,E,O,B,O,_],[_,O,B,B,E,E,B,B,B,B,E,E,B,B,O,_]];
const HN=[...HT,...FN,...HB],HH=[...HT,...FH,...HB2],HA=[...HTA,...FA,...HBA];
const TT=[[_,O,B,O,B,B,O,B,B,O,B,B,O,B,O,_]];
const TN=[[_,O,B,B,O,_,O,B,B,O,_,O,B,B,O,_],[_,_,O,O,_,_,_,O,O,_,_,_,O,O,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]];
const TS=[[_,O,B,O,_,_,O,B,O,_,_,O,B,O,_,_],[_,O,O,_,_,_,_,O,O,_,_,_,O,O,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]];
const TW=[[_,_,O,B,O,_,_,O,B,O,_,_,O,B,O,_],[_,_,_,O,O,_,_,_,O,O,_,_,_,O,O,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]];
const WA=[[_,O,B,B,O,_,O,B,B,O,_,O,B,B,O,_],[_,_,O,B,O,_,O,B,O,_,_,_,O,B,O,_],[_,_,_,O,O,_,O,O,_,_,_,_,_,O,O,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]];
const WB=[[_,O,B,B,O,_,O,B,B,O,_,O,B,B,O,_],[_,O,B,O,_,_,_,O,B,O,_,O,B,O,_,_],[_,O,O,_,_,_,_,_,O,O,_,O,O,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]];
const BC=[[_,O,B,B,O,_,O,B,B,O,_,O,B,B,O,_],[_,O,B,O,_,_,O,B,B,O,_,_,O,B,O,_],[_,O,O,_,_,_,_,O,O,_,_,_,_,O,O,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]];
const BT=[[_,O,B,B,O,_,O,B,B,O,_,O,B,B,O,_],[_,_,O,O,_,_,_,O,O,_,_,_,O,O,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]];
const STD=[...TT,...TN];
const ANIM={
  idle:[{h:HN,t:[...TT,...TN],y:0},{h:HN,t:[...TT,...TS],y:0},{h:HN,t:[...TT,...TN],y:0},{h:HN,t:[...TT,...TW],y:0}],
  running:[{h:HH,t:WA,y:1},{h:HH,t:STD,y:0},{h:HH,t:WA,y:1},{h:HH,t:WB,y:0}],
  done:[{h:HH,t:BC,y:2},{h:HH,t:STD,y:1},{h:HH,t:BT,y:0},{h:HH,t:STD,y:1}],
  rejected:[{h:HA,t:STD,y:0},{h:HA,t:STD,y:0},{h:HA,t:STD,y:1},{h:HA,t:STD,y:2},{h:HA,t:STD,y:2},{h:HA,t:STD,y:1}],
};
const ANIM_MS={idle:420,running:180,done:260,rejected:480};
const agSt={};
AG.forEach(ag=>{agSt[ag.id]={frame:0,interval:null,canvas:null,state:'idle',col:ag.col};});
function _drawFrame(id){
  const a=agSt[id];if(!a.canvas)return;
  const ctx=a.canvas.getContext('2d');
  const frames=ANIM[a.state]||ANIM.idle;
  const f=frames[a.frame%frames.length];
  ctx.clearRect(0,0,a.canvas.width,a.canvas.height);
  [...f.h,...f.t].forEach((row,ry)=>{row.forEach((cell,cx)=>{
    if(!cell)return;
    ctx.fillStyle=(cell===E||cell===O)?'#000':a.col;
    ctx.fillRect(cx*PX,(ry+(f.y||0))*PX,PX,PX);
  });});
}
function _startAnim(id,state){
  const a=agSt[id];
  if(a.interval){clearInterval(a.interval);a.interval=null;}
  a.state=state;a.frame=0;_drawFrame(id);
  a.interval=setInterval(()=>{a.frame=(a.frame+1)%((ANIM[a.state]||ANIM.idle).length);_drawFrame(id);},ANIM_MS[state]||420);
}
function drawOctopus(canvas,col,state,agId){
  const a=agSt[agId];
  const isNew=!a.canvas||a.canvas!==canvas;
  a.canvas=canvas;a.col=col;
  if(isNew||a.state!==state)_startAnim(agId,state);
}

// ── drag to pan viewBox ────────────────────────────────────────────────────────
const svg=document.getElementById('gsvg');
let pan={x:0,y:0,dragging:false,sx:0,sy:0};
let vb={x:-400,y:-300,w:800,h:600};

svg.addEventListener('mousedown',e=>{
  if(e.target===svg){pan.dragging=true;pan.sx=e.clientX;pan.sy=e.clientY}
});
svg.addEventListener('mousemove',e=>{
  if(!pan.dragging) return;
  const sc=svg.clientWidth/vb.w;
  vb.x-=(e.clientX-pan.sx)/sc; vb.y-=(e.clientY-pan.sy)/sc;
  pan.sx=e.clientX;pan.sy=e.clientY;
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
});
svg.addEventListener('mouseup',()=>pan.dragging=false);
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const sc=e.deltaY>0?1.15:0.87;
  vb.w*=sc;vb.h*=sc;
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
},{passive:false});

// ── WebSocket ──────────────────────────────────────────────────────────────────
let ws=null, wsRetry=null;
function connectWS(){
  const wsProto=window.location.protocol==='https:'?'wss:':'ws:';
  const wsHost=window.location.hostname||'127.0.0.1';
  const wsPort=window.location.port||'8000';
  ws=new WebSocket(wsProto+'//'+wsHost+':'+wsPort+'/ws');
  ws.onopen=()=>{
    document.getElementById('wsd').className='ws-dot on';
    document.getElementById('wst').textContent='connected';
    clearInterval(wsRetry);wsRetry=null;
  };
  ws.onclose=()=>{
    document.getElementById('wsd').className='ws-dot';
    document.getElementById('wst').textContent='offline — demo mode';
    if(!wsRetry) wsRetry=setInterval(connectWS,4000);
  };
  ws.onmessage=e=>{
    try{handleMsg(JSON.parse(e.data))}catch(err){}
  };
}
function wsSend(d){
  if(ws&&ws.readyState===1){ws.send(JSON.stringify(d));return true}
  return false;
}
function handleMsg(m){
  if(m.type==='session_created'){
    document.getElementById('sbSess').textContent=m.session_id.slice(0,8);
  }
  if(m.type==='agent_event'){
    const {agent,status,msg,elapsed}=m;
    addLog(agent,status,msg,elapsed);
    if(status==='running') setN(agent,'running');
    else if(status==='done') setN(agent,'done');
    else if(status==='rejected'){
      setN(agent,'rejected');
    }
    else if(status==='error'){
      if(agent==='Reviewer'&&msg.includes('secret')){
        cveCnt++;document.getElementById('hsC').textContent=cveCnt;
        showSec();
      }
    }
    else if(status==='dialogue'&&m.dialogue){
      addDialogue(m.dialogue);
    }

    // live quality score from Reviewer events
    if(agent==='Reviewer'&&msg){
      const qm=msg.match(/score (\d+)\/100/);
      if(qm){
        document.getElementById('hsQ').textContent=qm[1]+'/100';
        document.getElementById('hsQ').style.color=parseInt(qm[1])>=85?'var(--green)':parseInt(qm[1])>=70?'var(--yellow)':'var(--red)';
      }
    }

    // live file count
    const fm=msg&&msg.match(/(\d+) files?/);
    if(fm){fileCnt=parseInt(fm[1]);updStats()}

    // final quality score from System done event
    if(status==='done'&&agent==='System'){
      if(m.quality_score){
        const qs=m.quality_score;
        document.getElementById('hsQ').textContent=qs+'/100';
        document.getElementById('hsQ').style.color=qs>=85?'var(--green)':qs>=70?'var(--yellow)':'var(--red)';
      } else {
        document.getElementById('hsQ').textContent='100';
      }
      setStatus('DONE');stopClock();isRunning=false;
      document.getElementById('runBtn').disabled=false;
    }

    // complete event (project ready)
    if(status==='complete'&&agent==='System'){
      document.getElementById('hsQ').textContent='✓';
    }

    if(m.benchmark) showBench(m.benchmark);
  }
}

// ── live agent dialogue feed (reuses the dynPanel slot) ─────────────────────────
let dialogueEntries=[];
function addDialogue(d){
  dialogueEntries.push(d);
  document.getElementById('dynT').textContent='AGENT DIALOGUE';
  const rows = dialogueEntries.slice(-12).map(e=>{
    const cls = e.type==='request'?'sc-bad':e.type==='patch'?'sc-good':'';
    const arrow = `${e.from} → ${e.to}`;
    return `<div class="dlg-row ${cls}">
      <div class="dlg-meta"><span class="dlg-arrow">${arrow}</span><span class="dlg-type">${e.type}</span></div>
      <div class="dlg-content">${(e.content||'').slice(0,180)}</div>
    </div>`;
  }).join('');
  document.getElementById('dynB').innerHTML = `<div class="dlg-feed">${rows}</div>`;
  const dynB = document.getElementById('dynB');
  dynB.scrollTop = dynB.scrollHeight;
}

// ── node state ─────────────────────────────────────────────────────────────────
let _nLock={};
function setN(id,s){
  if(nstate[id]==='rejected'&&s==='running'&&!_nLock[id]){
    _nLock[id]=true;
    setTimeout(()=>{nstate[id]=s;_nLock[id]=false;_startAnim(id,'running');},2000);
    return;
  }
  nstate[id]=s;
  if(s==='done'){doneCnt++;updStats()}
  _startAnim(id,s==='done'?'done':s==='running'?'running':s==='rejected'?'rejected':'idle');
}

function updStats(){
  document.getElementById('hsA').textContent=`${doneCnt}/7`;
  document.getElementById('sbA').textContent=`${doneCnt}/7`;
  document.getElementById('hsF').textContent=fileCnt;
  document.getElementById('sbF').textContent=fileCnt;
}

// ── log ────────────────────────────────────────────────────────────────────────
function addLog(agent,status,msg,elapsed){
  const p=document.getElementById('lp');
  if(logs.length===0) p.innerHTML='';
  const ts=elapsed!=null?elapsed:(t0?((Date.now()-t0)/1000).toFixed(1):'0.0');
  logs.push({agent,status,msg,ts});
  const ac=`a${agent}`;
  const sc={'done':'cdone','running':'crun','error':'cerr'}[status]||'';
  const d=document.createElement('div');d.className='lr';
  d.innerHTML=`<span class="lts">${ts}s</span><span class="lag ${ac}">${(agent||'SYS').slice(0,8).toUpperCase()}</span><span class="lmsg ${sc}">${msg}</span>`;
  p.appendChild(d);p.scrollTop=p.scrollHeight;
  document.getElementById('lc').textContent=`${logs.length} events`;
}

function setStatus(t){document.getElementById('sbS').textContent=t}

function startClock(){
  t0=Date.now();
  ticker=setInterval(()=>{
    const sc=Math.floor((Date.now()-t0)/1000);
    document.getElementById('clk').textContent=`${Math.floor(sc/60).toString().padStart(2,'0')}:${(sc%60).toString().padStart(2,'0')}`;
  },500);
}
function stopClock(){clearInterval(ticker)}
const sl=ms=>new Promise(r=>setTimeout(r,ms));

// ── run actions ────────────────────────────────────────────────────────────────
async function doRun(){
  if(isRunning) return;
  const task=document.getElementById('tin').value.trim();
  if(!task) return;
  doReset(false);
  isRunning=true;document.getElementById('runBtn').disabled=true;
  setStatus('RUNNING');startClock();

  if(!wsSend({action:'run',task})){
    // demo mode
    const pipe=[
      {a:'Planner',   d:2600,f:0,m:'analyzing requirements'},
      {a:'Architect', d:3200,f:0,m:'designing architecture'},
      {a:'Coder',     d:8000,f:9,m:'generating production code'},
      {a:'Reviewer',  d:3800,f:0,m:'reviewing security & quality'},
      {a:'SelfHealer',d:2000,f:2,m:'self-healing pass'},
      {a:'Debugger',  d:1400,f:0,m:'checking runtime errors'},
      {a:'DocWriter', d:2500,f:1,m:'writing docs'},
    ];
    for(const step of pipe){
      setN(step.a,'running');addLog(step.a,'running',step.m);
      await sl(step.d);
      if(step.a==='Reviewer'){
        // conflict resolution beat: reject → coder revises → reviewer approves
        await sl(400);
        addLog('Reviewer','rejected','round 1: score 68/100 — 2 blocking issue(s), sent back to Coder');
        setN('Reviewer','rejected');
        addDialogue({from:'Reviewer',to:'Coder',type:'request',
          content:'REJECTED (round 1, score 68/100). Revision required: CRITICAL: hardcoded JWT secret fallback; missing input validation on /api/auth'});
        await sl(700);
        setN('Coder','running');addLog('Coder','running','revising per Reviewer feedback (round 1)');
        await sl(1400);
        addLog('Coder','done','revised 2 file(s)');
        setN('Coder','done');
        addDialogue({from:'Coder',to:'Reviewer',type:'patch',
          content:'Revision complete for round 1. Patched 2 file(s): auth.py, config.py. Resubmitting for review.'});
        await sl(600);
        setN('Reviewer','running');addLog('Reviewer','running','reviewing code quality & security (round 2)');
        await sl(900);
        cveCnt++;document.getElementById('hsC').textContent=cveCnt;
        addLog('Reviewer','error','critical — hardcoded jwt secret detected');
        showSec();
        addLog('Reviewer','done','approved — score 96/100 (round 2)');
        addDialogue({from:'Reviewer',to:'SelfHealer',type:'feedback',
          content:'Code APPROVED after 2 round(s). Score 96/100. No critical issues remain. SelfHealer to do proactive check.'});
      }
      if(step.a==='SelfHealer'){
        addLog('SelfHealer','running','patching secret → env-only');
        await sl(600);addLog('SelfHealer','done','cve resolved');
      }
      if(step.f>0){fileCnt+=step.f;updStats()}
      addLog(step.a,'done',step.a==='Coder'?`${fileCnt} files`:step.a==='DocWriter'?'readme done':'done');
      setN(step.a,'done');
    }
    addLog('System','done',`complete — ${fileCnt} files, 0 vulnerabilities`);
    document.getElementById('hsQ').textContent='100';
    setStatus('DONE');stopClock();isRunning=false;
    document.getElementById('runBtn').disabled=false;
  }
}

  const task=document.getElementById('tin').value.trim();

// ── tabs ───────────────────────────────────────────────────────────────────────
function setTab(tab, el){

// ── reset ──────────────────────────────────────────────────────────────────────
function doReset(resetN=true){
  logs=[];fileCnt=0;cveCnt=0;doneCnt=0;
  stopClock();isRunning=false;
  document.getElementById('clk').textContent='00:00';
  document.getElementById('lp').innerHTML='<div class="empty">waiting...</div>';
  document.getElementById('lc').textContent='0 events';

  setStatus('IDLE');
  if(resetN) AG.forEach(a=>{nstate[a.id]='idle'});
}
