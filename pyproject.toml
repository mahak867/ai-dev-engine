[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-ai-dev-engine"
version = "4.0.0"
description = "APEX Society: a 9-agent AI software team that plans, writes, reviews, sandbox-tests and repairs code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ai", "code-generation", "multi-agent", "llm", "groq", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Core runtime (CLI + agents). Keep in sync with requirements.txt.
dependencies = [
    "requests>=2.31,<3",
    "python-dotenv>=1.0.0,<2",
]

[project.scripts]
apex = "apex.cli:main"
apex-mcp = "apex.mcp_sdk:main"

[project.optional-dependencies]
# Dashboard / WebSocket server and the MCP-style tool server.
server = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.24,<1",
    "websockets>=12.0",
]
# Official MCP SDK server: `apex-mcp`
mcp = [
    "mcp>=1.13,<2",
]
# Eval harness scorers
eval = [
    "ruff>=0.5",
    "bandit>=1.7",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",      # required by fastapi.testclient
    "mcp>=1.13,<2",
    "ruff>=0.5",
    "bandit>=1.7",
    "build>=1.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apex*"]

[tool.setuptools.package-data]
apex = ["web/*.html", "evals/tasks.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-p no:cacheprovider --strict-markers"

[tool.ruff]
# Lowest supported Python — catches 3.12-only syntax (e.g. nested f-string quotes).
target-version = "py310"
extend-exclude = ["eval-results"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = [
    "E501",   # long prompt strings and messages are fine
    "SIM105", # try/except/pass reads clearer than contextlib.suppress in cleanup paths
    "B008",   # FastAPI's Body(...) defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E701", "E702", "SIM117"]
"apex/server.py" = ["E402"]     # load_dotenv() must run before app imports
"apex/tool_api.py" = ["E402"]
"apex/benchmark.py" = ["E402"]
"apex/cli.py" = ["E402"]        # banner docstring precedes imports

[tool.coverage.run]
source = ["apex"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
files = ["apex"]
