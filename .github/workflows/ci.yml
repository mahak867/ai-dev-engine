name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (syntax for the lowest supported Python, undefined names)
        run: python -m ruff check --select E9,F .

      - name: Pre-pull sandbox image
        run: docker pull -q python:3.12-slim

      - name: Run tests (hermetic HOME, no provider keys, real Docker sandbox)
        env:
          HOME: ${{ runner.temp }}/home
          APEX_MEMORY_DIR: ${{ runner.temp }}/apex-memory
          APEX_SANDBOX_IMAGE: python:3.12-slim
        run: |
          mkdir -p "$HOME"
          # pytest exits non-zero (5) when zero tests are collected.
          python -m pytest tests/ -v --tb=short
          test ! -d "$GITHUB_WORKSPACE/.apex"

  eval-selftest:
    name: Eval harness self-test (no key)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run 3-task self-test
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          python eval/run_eval.py --self-test --limit 3 --run-id ci --out "$RUNNER_TEMP/eval"
          cat "$RUNNER_TEMP/eval/ci/summary.md" >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Container image (public demo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t apex-society .
      - name: Refuses to start with a server-side provider key
        run: |
          if docker run --rm -e GROQ_API_KEY=gsk_should_not_be_here apex-society; then
            echo "container started with a provider key"; exit 1; fi
      - name: Health + demo mode
        run: |
          docker run -d --name apex -p 7860:7860 apex-society
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:7860/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:7860/api/health | python -c "import sys,json; d=json.load(sys.stdin); assert d['public_demo'] is True, d"
          test "$(docker inspect -f '{{.Config.User}}' apex-society)" = "apex"
          docker logs apex | tail -5
          docker rm -f apex

  package:
    name: Build + install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
          ls -l dist
      - name: Inspect wheel contents
        run: |
          python - <<'EOF'
          import zipfile, glob, sys
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["cli.py", "server.py", "mcp_server.py", "apex_mcp.py", "core/security.py",
                  "core/orchestrator.py", "core/telemetry.py", "core/execution/sandbox.py", "core/demo_llm.py"]
          missing = [n for n in need if n not in names]
          print("missing:", missing); sys.exit(1 if missing else 0)
          EOF
      - name: Clean-venv install + CLI smoke test
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install "$(ls dist/*.whl)[mcp]"
          cd /tmp
          /tmp/v/bin/apex --help
          /tmp/v/bin/apex-mcp --help
          HOME=/tmp/h APEX_MEMORY_DIR=/tmp/h/mem /tmp/v/bin/apex generate "smoke test" --name smoke --output /tmp/out --dry-run
          test -f /tmp/out/smoke/README.md
